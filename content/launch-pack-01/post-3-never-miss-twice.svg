<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="1350" fill="#0A0E14"/>
  <rect x="0" y="0" width="1080" height="12" fill="#FF4A1C"/>
  <g transform="translate(80,120)">
    <g transform="translate(0,-24)"><path d="M 22 6 A 24 24 0 1 0 46 30" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/><path d="M 13 -4 L 25 6 L 11 15 Z" fill="#FF4A1C"/></g>
    <text x="72" y="8" font-family="Impact,'Arial Narrow',sans-serif" font-size="40" letter-spacing="1" fill="#F4F7FB">RUN IT BACK</text>
  </g>
  <text x="80" y="290" font-family="'Courier New',monospace" font-size="26" letter-spacing="6" fill="#FF4A1C">NEVER MISS TWICE</text>
  <line x1="80" y1="318" x2="400" y2="318" stroke="#FF4A1C" stroke-width="4"/>
  <!-- streak motif -->
  <g transform="translate(80,400)">
    <rect x="0" y="0" width="86" height="86" rx="10" fill="#131C26"/><path d="M20 43 L38 61 L66 25" stroke="#8A9AAC" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="104" y="0" width="86" height="86" rx="10" fill="#131C26"/><path d="M124 43 L142 61 L170 25" stroke="#8A9AAC" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="208" y="0" width="86" height="86" rx="10" fill="#1A0E0B" stroke="#FF4A1C" stroke-width="3"/><path d="M231 23 L271 63 M271 23 L231 63" stroke="#FF4A1C" stroke-width="8" stroke-linecap="round"/>
    <rect x="312" y="0" width="86" height="86" rx="10" fill="#0C1219" stroke="#3B82F6" stroke-width="3"/><path d="M332 43 L350 61 L378 25" stroke="#3B82F6" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <g font-family="Impact, Haettenschweiler, 'Arial Narrow', sans-serif" letter-spacing="1">
    <text x="76" y="660" font-size="88" fill="#F4F7FB">YOU'RE</text>
    <text x="76" y="752" font-size="88" fill="#F4F7FB">ALLOWED TO MISS.</text>
    <text x="76" y="900" font-size="88" fill="#8A9AAC">YOU'RE NOT</text>
    <text x="76" y="992" font-size="88" fill="#FF4A1C">ALLOWED TO QUIT.</text>
  </g>
  <g transform="translate(80,1270)">
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="30" fill="#FF4A1C">↻</text>
    <text x="42" y="0" font-size="30" fill="#8A9AAC">run it back.  ·  missed today? don't miss tomorrow.</text>
  </g>
</svg>
