<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="1350" fill="#0A0E14"/>
  <g stroke="#131D28" stroke-width="1"><line x1="0" y1="450" x2="1080" y2="450"/><line x1="0" y1="1012" x2="1080" y2="1012"/><line x1="540" y1="0" x2="540" y2="1350"/></g>
  <text x="80" y="110" font-family="'Courier New',monospace" font-size="22" letter-spacing="5" fill="#3B82F6">LOGO OPTION D — "THE COMEBACK LINE"</text>
  <text x="80" y="150" font-size="24" fill="#8A9AAC">The fall and the recovery as one stroke — a chart that refuses to stay down.</text>

  <!-- big mark: V-bounce line with arrowhead -->
  <g transform="translate(290,700)">
    <!-- baseline (where it fell to) -->
    <line x1="-40" y1="150" x2="560" y2="150" stroke="#233240" stroke-width="6" stroke-dasharray="18 14"/>
    <!-- the line: descends, bottoms out, rockets up past its start -->
    <path d="M 0 -60 L 190 150 L 480 -180" fill="none" stroke="#FF4A1C" stroke-width="54" stroke-linejoin="miter" stroke-linecap="butt"/>
    <!-- arrowhead -->
    <polygon points="410,-215 545,-255 505,-120" fill="#F4F7FB"/>
  </g>

  <!-- avatar tests -->
  <text x="80" y="1060" font-family="'Courier New',monospace" font-size="20" letter-spacing="4" fill="#5B7185">AVATAR TEST</text>
  <g transform="translate(110,1150)">
    <circle cx="0" cy="0" r="80" fill="#131C26"/>
    <g transform="translate(-58,10) scale(0.24)"><path d="M 0 -60 L 190 150 L 480 -180" fill="none" stroke="#FF4A1C" stroke-width="54"/><polygon points="410,-215 545,-255 505,-120" fill="#F4F7FB"/></g>
    <circle cx="220" cy="0" r="46" fill="#131C26"/>
    <g transform="translate(186,6) scale(0.14)"><path d="M 0 -60 L 190 150 L 480 -180" fill="none" stroke="#FF4A1C" stroke-width="54"/><polygon points="410,-215 545,-255 505,-120" fill="#F4F7FB"/></g>
    <circle cx="360" cy="0" r="26" fill="#131C26"/>
    <g transform="translate(341,3) scale(0.08)"><path d="M 0 -60 L 190 150 L 480 -180" fill="none" stroke="#FF4A1C" stroke-width="54"/><polygon points="410,-215 545,-255 505,-120" fill="#F4F7FB"/></g>
  </g>

  <!-- lockup -->
  <g transform="translate(560,1150)">
    <g transform="translate(0,8) scale(0.11)"><path d="M 0 -60 L 190 150 L 480 -180" fill="none" stroke="#FF4A1C" stroke-width="54"/><polygon points="410,-215 545,-255 505,-120" fill="#F4F7FB"/></g>
    <text x="86" y="16" font-family="Impact,'Arial Narrow',sans-serif" font-size="52" letter-spacing="2" fill="#F4F7FB">RUN IT BACK</text>
  </g>
  <text x="80" y="1310" font-size="20" fill="#5B7185">Why: the comeback drawn literally (down → harder up) · doubles as the health/wealth "proof chart" · unique silhouette</text>
</svg>
