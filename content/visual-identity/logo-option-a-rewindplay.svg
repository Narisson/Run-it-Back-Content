<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="1350" fill="#0A0E14"/>
  <g stroke="#131D28" stroke-width="1"><line x1="0" y1="450" x2="1080" y2="450"/><line x1="0" y1="1012" x2="1080" y2="1012"/><line x1="540" y1="0" x2="540" y2="1350"/></g>
  <text x="80" y="110" font-family="'Courier New',monospace" font-size="22" letter-spacing="5" fill="#3B82F6">LOGO OPTION A — "REWIND / PLAY"</text>
  <text x="80" y="150" font-size="24" fill="#8A9AAC">Go back — then go again. The comeback in media language.</text>

  <!-- big mark: ◀◀ ▶ -->
  <g transform="translate(300,600)">
    <polygon points="150,-130 20,0 150,130" fill="#8A9AAC"/>
    <polygon points="300,-130 170,0 300,130" fill="#F4F7FB"/>
    <polygon points="360,-150 530,0 360,150" fill="#FF4A1C"/>
  </g>

  <!-- avatar tests -->
  <text x="80" y="1060" font-family="'Courier New',monospace" font-size="20" letter-spacing="4" fill="#5B7185">AVATAR TEST</text>
  <g transform="translate(110,1150)">
    <circle cx="0" cy="0" r="80" fill="#131C26"/>
    <g transform="translate(-46,0) scale(0.30)"><polygon points="150,-130 20,0 150,130" fill="#8A9AAC"/><polygon points="300,-130 170,0 300,130" fill="#F4F7FB"/><polygon points="360,-150 530,0 360,150" fill="#FF4A1C"/></g>
    <circle cx="220" cy="0" r="46" fill="#131C26"/>
    <g transform="translate(196,0) scale(0.17)"><polygon points="150,-130 20,0 150,130" fill="#8A9AAC"/><polygon points="300,-130 170,0 300,130" fill="#F4F7FB"/><polygon points="360,-150 530,0 360,150" fill="#FF4A1C"/></g>
    <circle cx="360" cy="0" r="26" fill="#131C26"/>
    <g transform="translate(347,0) scale(0.095)"><polygon points="150,-130 20,0 150,130" fill="#8A9AAC"/><polygon points="300,-130 170,0 300,130" fill="#F4F7FB"/><polygon points="360,-150 530,0 360,150" fill="#FF4A1C"/></g>
  </g>

  <!-- lockup -->
  <g transform="translate(560,1135)">
    <g transform="scale(0.14)"><polygon points="150,-130 20,0 150,130" fill="#8A9AAC"/><polygon points="300,-130 170,0 300,130" fill="#F4F7FB"/><polygon points="360,-150 530,0 360,150" fill="#FF4A1C"/></g>
    <text x="100" y="16" font-family="Impact,'Arial Narrow',sans-serif" font-size="52" letter-spacing="2" fill="#F4F7FB">RUN IT BACK</text>
  </g>
  <text x="80" y="1310" font-size="20" fill="#5B7185">Why: instantly readable at any size · aggressive geometry · the orange play = "go again"</text>
</svg>
