<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="1920" fill="#0A0E14"/>
  <g stroke="#141D28" stroke-width="1">
    <line x1="0" y1="480" x2="1080" y2="480"/><line x1="0" y1="960" x2="1080" y2="960"/><line x1="0" y1="1440" x2="1080" y2="1440"/>
    <line x1="360" y1="0" x2="360" y2="1920"/><line x1="720" y1="0" x2="720" y2="1920"/>
  </g>
  <!-- top brand bar -->
  <g transform="translate(80,120)">
    <g transform="translate(0,-24)"><path d="M 22 6 A 24 24 0 1 0 46 30" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/><path d="M 13 -4 L 25 6 L 11 15 Z" fill="#FF4A1C"/></g>
    <text x="72" y="8" font-family="Impact,'Arial Narrow',sans-serif" font-size="40" letter-spacing="1" fill="#F4F7FB">RUN IT BACK</text>
  </g>
  <text x="80" y="300" font-family="'Courier New',monospace" font-size="30" letter-spacing="6" fill="#3B82F6">THE DISCIPLINE LAB</text>
  <line x1="80" y1="330" x2="360" y2="330" stroke="#3B82F6" stroke-width="4"/>

  <!-- headline -->
  <g font-family="Impact, Haettenschweiler, 'Arial Narrow', sans-serif" letter-spacing="1">
    <text x="76" y="560" font-size="104" fill="#F4F7FB">THERE'S A PART</text>
    <text x="76" y="678" font-size="104" fill="#F4F7FB">OF YOUR BRAIN</text>
    <text x="76" y="796" font-size="104" fill="#F4F7FB">THAT GROWS</text>
    <text x="76" y="914" font-size="104" fill="#F4F7FB">WHEN YOU DO</text>
    <text x="76" y="1032" font-size="104" fill="#3B82F6">HARD THINGS.</text>
  </g>

  <!-- subline -->
  <text x="80" y="1240" font-size="40" fill="#8A9AAC">Discipline isn't a personality.</text>
  <text x="80" y="1295" font-size="40" fill="#C7D2DC">It's tissue you build — every rep counts.</text>

  <!-- footer tag -->
  <g transform="translate(80,1760)">
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="34" fill="#3B82F6">↻</text>
    <text x="46" y="0" font-size="34" fill="#8A9AAC">run it back.</text>
    <text x="0" y="60" font-size="28" fill="#4A5A6B">save this for the next time you don't feel like it</text>
  </g>
</svg>
