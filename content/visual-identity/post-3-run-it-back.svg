<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="g" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="#0A0E14"/>
  <circle cx="540" cy="560" r="560" fill="url(#g)"/>
  <!-- top brand bar -->
  <g transform="translate(80,130)">
    <g transform="translate(0,-24)"><path d="M 22 6 A 24 24 0 1 0 46 30" fill="none" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/><path d="M 13 -4 L 25 6 L 11 15 Z" fill="#FF4A1C"/></g>
    <text x="72" y="8" font-family="Impact,'Arial Narrow',sans-serif" font-size="40" letter-spacing="1" fill="#F4F7FB">RUN IT BACK</text>
  </g>
  <text x="80" y="330" font-family="'Courier New',monospace" font-size="30" letter-spacing="8" fill="#8A9AAC">RUN IT BACK · comeback</text>

  <!-- big loop mark -->
  <g transform="translate(540,720)">
    <path d="M 0 -150 A 150 150 0 1 0 106 -106" fill="none" stroke="#3B82F6" stroke-width="30" stroke-linecap="round"/>
    <path d="M -44 -196 L 24 -150 L -46 -104 Z" fill="#FF4A1C"/>
  </g>

  <!-- headline -->
  <g font-family="Impact, Haettenschweiler, 'Arial Narrow', sans-serif" letter-spacing="1" text-anchor="middle">
    <text x="540" y="1160" font-size="126" fill="#F4F7FB">IT'S NOT THE</text>
    <text x="540" y="1300" font-size="126" fill="#F4F7FB">KNOCKDOWN.</text>
    <text x="540" y="1510" font-size="112" fill="#8A9AAC">IT'S THE</text>
    <text x="540" y="1640" font-size="150" fill="#3B82F6">GET-UP.</text>
  </g>

  <!-- footer -->
  <g transform="translate(0,1800)" text-anchor="middle">
    <text x="540" y="0" font-size="34" fill="#8A9AAC"><tspan font-family="'Courier New',monospace" fill="#3B82F6">↻ </tspan>run it back.</text>
  </g>
</svg>
